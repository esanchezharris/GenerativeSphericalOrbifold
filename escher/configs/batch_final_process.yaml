# Round 4 -- the final-process batch: attack run-to-run variance at its three
# sources so the FIRST run is the keeper. Acceptance: img_s0 and img_s1 both
# keeper-quality and near-identical in gestalt (the seed stops mattering), and
# the one-shot bird lands first try with zero retries.
#
#   python -m escher.pipeline escher/configs/batch_final_process.yaml
#
# Prerequisite (once, ~1 min GPU): the fish color anchor --
#   python escher/make_target.py COLOR=true N=4 OUT_DIR=assets/targets/fish64 \
#     "PROMPT=a fish with scales and fins, flat vector illustration, solid pastel colors, simple shapes, white background, centered, full body, a masterpiece"
#
# Morning eval (EMA panels included automatically):
#   python escher/sanity_checks/eval_specificity_batch.py ROOT=runs/final_process \
#       CARVE=runs/acceptance_fish/fish_run1/carve_s0/checkpoint.pt

batch_name: final_process
runs_root: runs

defaults:
  orbifold: [2, 3, 4]
  texture_seeds: [0]
  reuse_carve: runs/acceptance_fish/fish_run1/carve_s0/checkpoint.pt
  prompt: "a fish with scales and fins, flat vector illustration, solid pastel colors, simple shapes, a masterpiece"
  stages:
    texture:
      CONF_FILE: [configs/sphere_texture.yaml, configs/sphere_texture_octa.yaml, configs/sphere_texture_octa_joint.yaml]
      TEXTURE_DROP_PROB: 50
      COTANGENT_RELATIVE_WEIGHTS: true
      TORCH_COMPILE: true
      TIMING: true
      KEEP_CHECKPOINTS: 5
      TEXTURE_EMA_DECAY: 0.998   # recorded in every arm; pure observer
    render:
      TINT: true

jobs:
  - figure: rerun_s0            # the CUDA-chaos floor: R2 joint_drop, its own seed
    # (identical to round 2's winner arm; EMA recording is the only addition)

  - figure: img_s0              # image-anchored init, seed 0
    color_target: assets/targets/fish64/color.png

  - figure: img_var_s0          # + noise averaging x2 (adopt only if it matters)
    color_target: assets/targets/fish64/color.png
    stages:
      texture:
        SDS_NOISE_SAMPLES: 2

  - figure: img_s1              # SEED-INVARIANCE: the same stack, different seed
    color_target: assets/targets/fish64/color.png
    stages:
      texture:
        SEED: 1

  - figure: noinit_s1           # the no-init track at seed 1 (user: compare both)
    stages:
      texture:
        SEED: 1

  - figure: bird_img            # one-shot: full pipeline + auto color anchor
    reuse_carve: null
    color_target: auto
    prompt: "a song bird with folded wings, flat vector illustration, solid pastel colors, simple shapes, a masterpiece"
    silhouette_prompt: "a plain solid black silhouette of a song bird with folded wings, white background, minimal flat logo, centered, full body"
    seeds: [0]
    stages:
      target:
        N: 32
        STEPS: 30
      screen:
        CONF_FILE: [configs/sphere_shape_weights_fish2.yaml]
        TARGET_SWEEP_STEPS: 150
        KEEP_CHECKPOINTS: 1
      carve:
        CONF_FILE: [configs/sphere_shape_weights_fish2.yaml]
        SHAPE_STEPS: 1500
        KEEP_CHECKPOINTS: 2
