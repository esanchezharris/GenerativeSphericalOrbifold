AREA_TAIL_WEIGHT: 0.0
BOUNDARY_SMOOTH_WEIGHT_W: 0.0
W_REGULARIZATION: 0.02
ISOLATED_ROLL_DEG: 45.0
TEXTURE_DROP_PROB: 50
RESET_SHAPE_OPTIMIZER_ON_RESUME: true
W_REVERT_ON_FOLD: true
KITE_N: 40
