# Spherical orbifold tiling via score distillation.
# The planar counterpart is base.yaml; options that behave identically keep their names.

### prompt
PROMPT: "a gingerbread man, flat vector illustration, a masterpiece"
NEGATIVE_PROMPT: ""

### parameterization
# "weights": Tutte edge weights steer the shape indirectly (the original pipeline).
# "boundary": the free half of the cut is parameterized DIRECTLY (~35 points); mates are
#   generated by the symmetry group so tiles interlock by construction, the whole boundary
#   is pinned, and the interior follows a fixed-boundary solve with uniform weights --
#   the reference's FixedBoundaryConditions/embed_from_boundary mode. SDS's silhouette
#   gradient lands on the outline as first-class parameters.
PARAM_MODE: "boundary"
LR_BOUNDARY: 0.004     # boundary points move in radians; far smaller scale than weight logits
BOUNDARY_SPACING_WEIGHT: 3000.0   # variance of segment lengths -- prevents bunching
BOUNDARY_SMOOTH_WEIGHT: 1000.0    # second differences -- discourages jagged, crossing curves
# Hinge barrier on per-face area ratio: zero while every face keeps >= MARGIN of its
# reference area, ramping quadratically toward the fold. Rejection (undo folding steps)
# stays on as the hard guarantee; without this gradient it rejected 78% of steps and the
# outline stalled -- Adam kept ramming a wall it could not feel.
BOUNDARY_MARGIN: 0.15
BOUNDARY_MARGIN_WEIGHT: 50000.0

### orbifold
# Cone orders (K, 2, 2): the dihedral group D_K, giving 2*K tiles on the sphere.
# K=4 -> 8 tiles, K=6 -> 12. Larger K means smaller, more numerous tiles.
ORBIFOLD_K: 4
MESH_N_THETA: 28      # rings from pole to equator
MESH_N_PHI: 19        # vertices across the lune; must be ODD (2-fold cone at the midpoint)
# Three-cone orbifolds (boundary mode only): null keeps the dihedral lune above; a list
# like [2, 3, 4] switches to the kite fundamental domain -- octahedral, 24 tiles, the
# figure density of the target image. KITE_N is the subdivision per triangle edge.
ORBIFOLD_CONES: null
KITE_N: 20

### tile shape
# Edge weights are sigmoid(W) mapped into [r, 1-r] with r = (1 - W_RANGE)/2, matching the
# planar pipeline. Closer to 1 permits more extreme tile deformation.
W_RANGE: 0.95
LR_W: 0.03
# false: W = 0 gives UNIFORM weights (upstream's convention -- correct for their square
#   grid, which has no prescribed shape).
# true:  W = 0 gives the reference solver's CLAMPED COTANGENT weights, at which the solve
#   reproduces the designed lune/kite exactly. Measured on (2,3,4): per-face area spread
#   82.1 -> 1.4 and drift from the designed mesh 0.143 -> 0.000. Since the kite's UV is
#   uniform barycentric, that spread is also the texel-density variation across one tile,
#   i.e. an 82x range in effective per-texel learning rate for the texture phase.
COTANGENT_RELATIVE_WEIGHTS: false

### texture
# One tile covers roughly 250 px of a 512 render, so a 512 texture is ~4x oversampled and
# SDS fills the surplus with high-frequency noise instead of a figure. 256 matches better.
TEXTURE_RESOLUTION: 256
LR_TEXTURE: 0.01
CLAMP_TEXTURE: true
# Upstream GEM parity (base.yaml BW: True, main.py:624-625): constrain the paint to
# greyscale -- channel 0 of the parameter tiled to RGB at render time, so SDS can only
# deposit luminance. The paper's figures are greyscale BY DESIGN (guidance 100 trades
# color for shape quality; its RGB ablation shows the degradation). false = full-color
# parameter = every prior run, bitwise.
BW: false
# Upstream parity option (main.py:410): uniform-random per-texel init instead of a
# flat color. Ignored when TEXTURE_INIT_PATH is set; takes precedence over
# TEXTURE_INIT_COLOR. false = flat init = every prior run.
TEXTURE_INIT_RANDOM: false
# Upstream parity option (main.py:339): W starts from N(0, std^2) under the run
# SEED instead of zeros -- the paper's actual init, a different basin. 0.0 = zeros.
W_INIT_RANDN: 0.0
# The IFT adjoint is exact only at a converged forward solve; the achieved
# stationarity |Pg|_inf is logged every unfrozen step (metrics.csv). A value
# here (> 0) additionally prints a warning when a step exceeds it. 0 = observe.
STATIONARITY_WARN: 0.0

### solver acceleration (all default to the reference behavior)
# With the encoder swap done, the CPU Tutte solve is the dominant per-step cost.
# Each knob below was measured; every one is verified against tests/test_golden_
# solution.py (the MATLAB-output pin) and the finite-difference gradient gate.
#
# Provably exact -- these change nothing but the work done:
SOLVER_CACHE_AFFINE: false   # A and b are run constants in weights mode, yet
                             # AffineSpace (dense eigvalsh + Cholesky) was rebuilt
                             # every solve. Bit-identical. ~1.5 ms/step.
ADJOINT_REUSE_FACTOR: false  # keep the previous adjoint LU and use it as a GMRES
                             # preconditioner. Exact -- GMRES drives the TRUE
                             # residual, which the code already gates on. The
                             # factorization is 74% of the adjoint and 60x its own
                             # solve. ~20-26 ms/step at KITE_N 40.
# Same fixed point, different route (measured max vertex move 4e-9, vs a 1e-6
# golden gate):
SOLVER_PRECOND_EVERY: 1      # rebuild the Laplacian preconditioner every K solves.
                             # It only steers; measured iteration penalty at K=5
                             # (or even K=inf) is ZERO. ~14 ms/step.
SOLVER_TWO_LOOP_ORDER: "reference"  # "textbook" fixes the L-BFGS two-loop
                             # recursion, whose second loop runs newest->oldest
                             # here (Nocedal & Wright 7.4 requires oldest->newest).
                             # It is a FAITHFUL port of the same deviation in
                             # OptimSolverLBFGS_NEW.m -- which is why memory is
                             # pinned at 3: with the wrong order more pairs make
                             # the direction WORSE. Fixed + memory 8: 33 -> 23
                             # iterations/step.
SOLVER_MEMORY: 3             # only worth raising with SOLVER_TWO_LOOP_ORDER textbook
SOLVER_TOL_GRAD: 0.0         # stop on |Pg|_inf -- the quantity the IFT adjoint
                             # actually needs, already logged per step. At 1e-8:
                             # 33 -> 22 iters for achieved stationarity 7e-9 and a
                             # 5e-8 relative gradient move (~7 orders under SDS
                             # noise). Do not exceed 1e-7.
SOLVER_LINE_SEARCH: "backtrack"  # "interp" adds a warm starting step and a
                             # safeguarded quadratic on first rejection: -33%
                             # f-evals in the WARM regime, but measured WORSE cold.
# Upstream GEM parity: StepLR x0.1 at 80% of N_STEPS on BOTH parameter groups
# (their SCHEDULER: step default). false = constant LRs = every prior run.
LR_STEP_SCHEDULE: false

### rendering
IMAGE_BATCH_SIZE: 4   # views per step. 12 GB VRAM: 4 at 512 fits, 6 is tight.
RENDER_SIZE: 512
# Aim each view at ONE tile, close up, rather than at the whole sphere. Score distillation
# asks the model to make the rendered image match the prompt, so the frame has to contain a
# figure-sized region -- the planar pipeline renders exactly one fundamental domain
# (main.py leaves mv/proj at the identity). Framing the whole sphere asks the model to turn
# an 8-tile ball into one gingerbread man, and the texture degenerates into noise.
TILE_CENTRIC_VIEWS: true
CAMERA_DISTANCE: 1.4  # cap half-angle ~44 deg: one tile dominant, neighbours visible
CAMERA_FOV: 40.0
VIEW_JITTER_DEG: 12.0
# GEM's random-rigid augmentation for ISOLATED training views: std-dev (degrees) of a
# random roll about the view axis, view 0 kept clean (upstream vertex_augmentation is
# randn * pi/4 = 45 deg std). 0 = off = every prior run. Without it the isolated pass
# always frames the tile at one fixed orientation and the outline overfits that pose.
ISOLATED_ROLL_DEG: 0.0
RANDOM_BACKGROUND: true
# Snapshots and turntables frame the whole sphere, unlike the close-up training views.
PREVIEW_DISTANCE: 3.0
# Half the steps render a SINGLE tile against the background instead of the full tiling.
# The tiling covers every view completely, so it offers no silhouette -- without these steps
# only the texture can respond to the prompt and the tile outline stays smooth. This is what
# turns the tile SHAPE into the figure, which is the whole point of an Escher tiling.
### shape regularizers
# Calibrated against measured states, not guessed. equal_area_loss (per-face solid-angle
# drift from the undeformed lune) measures 0.14 at the start, 0.83 at the healthy 7000-step
# run, and 32.2 at the degenerate strong-silhouette run -- a 39x gap. Weight 2000 makes the
# term mild (~1.7k) against healthy deformation and dominant (~64k) against degeneracy.
# Weight-dialing the mean term alone failed in BOTH directions (2000 ran away at step 1030,
# 5000 pulled the shape back to the lune), so the barrier is split: a gentle mean term plus
# a strong tail term on the worst 5% of faces. Calibrated per-state values (mean / tail):
# start 0.14/0.31 -- healthy 1.58/12.6 -- alerted 2.98/27.6 -- degenerate 32.2/485.
EQUAL_AREA_WEIGHT: 500.0
AREA_TAIL_WEIGHT: 800.0
AREA_TAIL_FRACTION: 0.05
# Upstream parity: main.py line 615 adds W_REGULARIZATION * sum(W^2) every step. Degenerate
# configurations need sigmoid saturation (large raw W: 68k at the degenerate run vs 11k
# healthy), so this is a gentle extra prior on top of the area term.
# (base.yaml's comments for these two knobs are swapped relative to the code; the code wins.)
W_REGULARIZATION: 0.02

### silhouette loss
# SDS on a flat-coloured, untextured tile. The textured passes let the optimiser cheat: it
# can paint a convincing figure INSIDE an unchanged tile, because the texture has far more
# capacity than the outline. That yields a smooth lune with a picture on it, not an Escher
# tiling -- in a real one the outline itself is the figure, which is what makes neighbours
# interlock. A solid fill removes the escape route, leaving the silhouette as the only thing
# that can change the image.
# Set SILHOUETTE_WEIGHT to 0 to disable.
SILHOUETTE_WEIGHT: 1.0
SILHOUETTE_EVERY: 3        # every Nth step, so it costs ~1/3 extra time
SILHOUETTE_BATCH_SIZE: 4
# The pass shows the model a flat solid shape, so the prompt must DESCRIBE a flat solid
# shape. Reusing the main prompt asks for color and interior detail the pass cannot express,
# and that mismatch leaks through the boundary pixels as directionless pressure -- perimeter
# growth without figure, the measured failure of the unregularized strong-silhouette run.
SILHOUETTE_PROMPT: "a plain solid black silhouette of a gingerbread man, simple flat shape, white background, minimal logo"
SILHOUETTE_FIGURE_VALUE: 0.1    # near-black figure, matching the prompt
SILHOUETTE_BACKGROUND_VALUE: 0.95  # on a near-white background

ISOLATED_TILE_FRACTION: 0.5
# Must be close enough that the TILE fills the frame. At 2.6 a lone tile covers only ~1/8 of
# the view, which teaches the model to paint small figures -- the opposite of what is wanted.
ISOLATED_DISTANCE: 1.7

### guidance
# base.yaml names stabilityai/stable-diffusion-2-1-base, which is now gated on the Hub and
# 401s without an accepted licence and a token. This is an ungated third-party mirror of the
# same weights in diffusers format -- same model as the original config, no auth needed.
# Note it is a re-upload, so its provenance is weaker than an official repo; swap in
# "runwayml/stable-diffusion-v1-5" (also ungated) if that matters for your use.
PRETRAINED_MODEL_NAME_OR_PATH: "Manojb/stable-diffusion-2-1-base"
# base.yaml uses 100. That suits the planar setup but here it drives the texture into
# high-frequency artefacts; 50 trades a little prompt fidelity for markedly cleaner figures.
GUIDANCE_SCALE: 50.0
# Which encoder maps the render into SD latent space. MEASURED (timing.csv over 14
# full runs): the encoder is ~48% of wall clock -- it is the ONLY network in the
# SDS backward, so we pay it twice, and it costs 2.1x the diffusion UNet it feeds.
#   "vae"       AutoencoderKL, posterior sample -- every prior run, the default
#   "vae_mean"  same encoder, posterior MEAN (control: isolates the sampling noise)
#   "taesd"     madebyollin/taesd -- ~1.2M params, no GroupNorm, no attention;
#               emits SD's already-scaled latents (its scaling_factor is 1.0)
#   "taesd_bwd" SD latents in the forward, TAESD's Jacobian in the backward
SDS_ENCODER: "vae"
USE_HALF_PRECISION: true
CLIP_GRADIENTS_IN_SDS: true

### optimisation
N_STEPS: 1500
SEED: 0
# Warm-starting the spherical solve is the main throughput lever: consecutive steps move the
# weights only slightly, so each solve resumes near its answer.
WARM_START: true
# Shape is frozen after this step and only the texture keeps training, which stops
# late-stage SDS noise from wrecking a good tile outline.
FREEZE_SHAPE_AFTER: 1200
# Condition-based freeze (0 = disabled). SDS trajectories are chaotic -- two runs with
# identical settings and seed diverged to perim 1.47 vs 1.08 by step 400 (CUDA
# nondeterminism compounds) -- so freezing on the reached STATE beats freezing on a step
# count: lock the shape once the perimeter target is hit, or once spread hits the ceiling,
# whichever comes first. Latched.
FREEZE_ON_PERIM: 0.0
FREEZE_ON_SPREAD: 0.0

### texture init + SDS schedule
# null keeps the historical 0.5 gray init; an [r, g, b] list starts from that flat color
# so SDS spends its budget on figure detail instead of climbing out of gray.
TEXTURE_INIT_COLOR: null
# Mean squared texture finite differences: the anti-"knitted" prior. 0 disables.
TEXTURE_TV_WEIGHT: 0.0
# 0 disables. > 0 linearly anneals the SDS max-timestep fraction from SDS_MAX_START to
# SDS_MAX_END by that step: early high-noise samples compose, late low-noise ones polish.
SDS_ANNEAL_END: 0
SDS_MAX_START: 0.98
SDS_MAX_END: 0.5
# Raise the sampled-timestep FLOOR (0 = model default 0.02). High floors keep SDS
# in the layout band -- low-t samples are where high-frequency detail is deposited
# (spectral autoregression). Round-7 mark-refinement guard; clamps the anneal max.
SDS_MIN_STEP: 0.0

### presentation
# Ambient floor for the diffuse shading applied to render_final's video and stills
# (render-time ONLY -- training stays unlit so what SDS sees never changes). Unlit, a
# rotating textured sphere has no shape-from-shading cue and the turntable reads
# ambiguously as the concave inside of the ball; this resolves it. `SHADE=0` on the
# render_final command line restores the flat look.
SHADE_AMBIENT: 0.55
# Per-tile hue rotation (escher/rendering/palette.py): neighbors get different palette
# hues, the alternating-color Escher look. RENDER-TIME ONLY -- snapshots' wide panels and
# render_final; training always sees identity (tinted training views would push
# conflicting hues into the one shared texture).
TILE_TINT: false
PALETTE_HUES_DEG: [0.0, 120.0, -120.0]
# Colorization: per-tile DIAGONAL RGB scaling along the same 3-coloring. The hue
# tint is a NO-OP on greyscale (BW) textures (achromatic fixed point); this is
# the color presentation for them. null palette = the pastel default
# (palette.PASTEL_PALETTE); palette.XMAS_PALETTE is the red/green/gold ornament
# set. Tint takes precedence when both are armed. Render-time only, like TINT.
COLORIZE: false
COLORIZE_PALETTE: null

### output
OUTPUT_DIR: "output/sphere"
VISUALIZATION_FREQ: 50
# Snapshot cadence, decoupled from checkpoints/geometry checks; null = same as
# VISUALIZATION_FREQ (the historical behavior).
SNAPSHOT_FREQ: null
# Keep only the newest N step-tagged checkpoints (-1 = keep all, historical).
# checkpoint.pt (the latest) always survives.
KEEP_CHECKPOINTS: -1

### joint shape+texture (GEM-parity) window -- all default off; the overlay
### sphere_texture_octa_joint.yaml arms them together. Only meaningful when
### FREEZE_SHAPE_AFTER > 0 on a texture run resumed from a carve.
# Drop the carve's Adam moments for the shape on resume (they were built from
# mask-loss gradients ~3 orders larger than SDS's and kick the shape at step 0).
RESET_SHAPE_OPTIMIZER_ON_RESUME: false
# Weights-mode fold rejection (backtrack toward the last certified W) during the
# joint window, plus the freeze-latch guard. The deterministic carve never
# needed it; SDS's noisier pulls make folds plausible again.
W_REVERT_ON_FOLD: false
# The carve's outline-smoothness prior, live during the joint window (0 = off).
BOUNDARY_SMOOTH_WEIGHT_W: 0.0
### first-time-right levers (round 4; all default off/null)
# Image-anchored texture init (escher/texture_init.py bakes it): an npy of shape
# (TEXTURE_RESOLUTION^2, 3) replacing the flat init -- composition and palette
# decided BEFORE step 0 instead of by early SDS noise (the dominant source of
# run-to-run variance).
TEXTURE_INIT_PATH: null
# Trajectory-average deliverable: checkpoint carries texture_ema alongside the
# raw texture (load with ema=True / EMA=1). Pure observer. 0 = off; 0.998 gives
# an effective window of ~500 steps.
TEXTURE_EMA_DECAY: 0.0
# Independent SDS noise draws averaged per step (same timestep): 1/N gradient
# variance at N UNet evals (~+0.18 s/step at 2).
SDS_NOISE_SAMPLES: 1

# Isolated-view share for the FROZEN tail only (null = ISOLATED_TILE_FRACTION,
# the historical behavior). Lowering it (e.g. 0.25) makes the frozen texture
# answer mostly to TILED Escher-context views -- the round-2 lever against the
# nested-figure attractor that isolated views reinforce.
ISOLATED_TILE_FRACTION_FROZEN: null
# GEM's texture drop, percent of the batch (planar runs 50): dropped elements
# render the tile as a flat random-gray cutout -- a pure OUTLINE signal under
# the same prompt. Isolated + unfrozen steps only. 0 = off.
TEXTURE_DROP_PROB: 0.0
# GEM's tight crop of isolated views (alpha-bbox x1.1, resized back): SDS sees a
# frame-filling figure while the camera keeps the margin antialias needs.
CROP_RENDERINGS: false

### zero-background texture levers (all default off; see escher/rendering/texture_mask.py)
# Chroma floor on the sampled texels: the per-tile hue tint is a rotation about the
# RGB gray axis, so achromatic (white/gray) paint renders identically in EVERY tile
# and reads as one continuous background field. Weight ~10-50 against TV's 100.
TEXTURE_FILL_WEIGHT: 0.0
TEXTURE_FILL_CHROMA_MIN: 0.15
# Every N steps, refill the never-rasterized ~60% of texels with their nearest
# sampled color (mip-leak fix during training; render_final always fills at export
# unless GUTTER=0). 0 = off.
TEXTURE_GUTTER_FILL_EVERY: 0
DEVICE: "cuda"
# Per-phase timing breakdown (escher/misc/timing.py) -> timing.csv beside metrics.csv.
# Inserts cuda synchronize at phase boundaries, which itself slows the loop -- enable
# only when measuring, never for production runs.
TIMING: false
# Rasterizer for the cached default nvdiffrast context: "gl" reproduces every prior
# run bit-identically; "cuda" is a different rasterizer implementation (edge pixels
# may differ at exact coverage ties) -- opt-in A/B only.
RASTER_CONTEXT: "gl"

### GPU backend toggles -- all opt-in; each changes kernel/algorithm selection, so
### runs are statistically (not bitwise) comparable with them on. Measured on the
### 60-step timing probe before changing any default.
# cudnn autotune; every conv shape in the loop is static, the classic best case.
CUDNN_BENCHMARK: false
# TF32 matmul/conv for float32 GPU work (the diffusion stack is fp16; this touches
# only the float32 remainder).
ALLOW_TF32: false
# NHWC memory format for the UNet.
CHANNELS_LAST: false
# torch.compile the UNet + VAE encoder. First step pays a minutes-long compile;
# only sensible for full-length texture runs.
TORCH_COMPILE: false
