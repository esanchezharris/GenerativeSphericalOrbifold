# Round 17 morning -- the winning stack, stabilized and generalized.
#
#   python -m escher.pipeline escher/configs/batch_r17_morning.yaml
#
# ROUND-17 NIGHT VERDICT (rosette deg 2a/3/2b | white | figure):
#   wide_floor           9.25/8.25/ 4.00 | 0.346 | intact -- runner-up
#   wide_floor25        27.50/4.25/ 5.50 | 0.487 | too much uniform charge
#   wide_floor_kite56   15.25/5.00/ 3.50 | 0.349 | no capacity gain (paint, not geometry)
#   wide_white_hi_s1    20.00/5.00/ 9.00 | 0.483 | seed spread ~5 deg on the penalty
#   wide_drop75          5.00/14.25/14.0 | 0.414 | relocated, no win
#   wide_noclause_floor  1.00/6.00/ 4.50 | 0.289 | THE WINNER -- figure fully intact
#
# Dropping ", on a white background" from the PROMPT while keeping white
# COMPOSITING broke the corner equilibrium exactly as predicted: SDS stopped
# repainting the corners white, the penalty swept them, worst corner 6.00 deg
# (best figure-bearing arm ever; prompt_wide was 23.25) and white fraction
# 0.289 (lowest ever on gingerbread). 4pi cert, flips 0, reverts 0.
#
# THE RECIPE: subject prompt with NO background clause + white compositing
# (RANDOM_BACKGROUND false, the round-12 murk fix, untouched) + white penalty
# 1000 @ corner 0.15 floor 0.1 + XMAS4 renders (full palette distinct at every
# rotation centre).
#
# This batch: (a) the winner at seed 1 -- does the recipe reproduce, or was it
# seed luck? (b) the remaining Christmas subjects on the winning stack.

batch_name: r17_morning
runs_root: runs

defaults:
  orbifold: [2, 3, 4]
  texture_seeds: [0]
  reuse_carve: runs/r10_parity/prep/carve_identity40/checkpoint.pt
  stages:
    texture:
      CONF_FILE: [configs/sphere_texture.yaml, configs/sphere_texture_octa.yaml, configs/sphere_texture_octa_gemfull.yaml, configs/sphere_texture_octa_parity.yaml, configs/sphere_texture_octa_clean.yaml, configs/sphere_texture_octa_fast.yaml]
      KITE_N: 40
      TORCH_COMPILE: true
      TIMING: true
      KEEP_CHECKPOINTS: 5
      TEXTURE_FILL_WHITE_LEVEL: 0.85
      TEXTURE_FILL_WHITE_WEIGHT: 1000.0
      TEXTURE_FILL_CORNER_UV: 0.15
      TEXTURE_FILL_CORNER_FLOOR: 0.1
    render:
      TINT: false
      COLORIZE_PALETTE: [[0.86, 0.30, 0.30], [0.38, 0.64, 0.40], [0.93, 0.78, 0.42], [0.58, 0.73, 0.88]]

jobs:
  - figure: ginger_noclause_s1
    prompt: "A professional cartoon of a gingerbread man with long arms and legs stretched wide, a masterpiece"
    texture_seeds: [1]

  - figure: stocking
    prompt: "A professional cartoon of a Christmas stocking, a masterpiece"

  - figure: reindeer
    prompt: "A professional cartoon of a reindeer, a masterpiece"

  - figure: candycane
    prompt: "A professional cartoon of a candy cane, a masterpiece"
